spring:
  application:
    name: chef-control-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chefcontrol2025}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

# Por omissão 8081 = mesmo que `bolo-gest` em api.config.ts e `iniciar-backend.bat` (evita 404 no login por porta errada).
server:
  port: ${SERVER_PORT:8081}

# CORS (ajustar em produção para o domínio do front)
app:
  cors-allowed-origins: http://localhost:4200
  license-amount: 500
  e-mola-phone: "871964887"
  mpesa-phone: "846746170"
  support-whatsapp: "871964887"
  trial-days: 14
  # SMS (operador nacional) e WhatsApp via Twilio
  # Confirmação de conta (registo) + código de licença (após admin confirmar pagamento)
  twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
  twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
  twilio-from-number: ${TWILIO_FROM_NUMBER:}
  # WhatsApp: número com prefixo whatsapp: (ex.: whatsapp:+14155238886 sandbox). Se vazio, só envia SMS.
  twilio-whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
  payment:
    simulation:
      # Por omissão: pagamento de licença só simulado (M-Pesa/e-Mola fictício); notifica admins. Defina APP_PAYMENT_SIMULATION_ENABLED=false para tentar API real.
      enabled: ${APP_PAYMENT_SIMULATION_ENABLED:true}

# M-Pesa OpenAPI (sandbox por defeito)
mpesa:
  api-key: ${MPESA_API_KEY:}
  public-key: ""
  environment: sandbox
  market: vodacomMOZ
  service-provider-code: ${MPESA_SERVICE_PROVIDER_CODE:171717}
  # URL pública de callback (ngrok em dev, domínio real em produção)
  callback-base-url: ${MPESA_CALLBACK_URL:http://localhost:8081}
