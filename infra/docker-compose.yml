services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./db.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # só acessível na própria VPS, nunca exposto à internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081" # nginx faz proxy para aqui

volumes:
  pgdata:
