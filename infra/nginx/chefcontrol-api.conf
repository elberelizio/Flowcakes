# Copiar para /etc/nginx/sites-available/chefcontrol-api na VPS
# depois: ln -s /etc/nginx/sites-available/chefcontrol-api /etc/nginx/sites-enabled/
#
# SUBSTITUIR api.SEUSUBDOMINIO.duckdns.org pelo teu subdomínio real antes do certbot.

server {
    listen 80;
    server_name api.SEUSUBDOMINIO.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
