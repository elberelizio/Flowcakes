@if (adminLoginSummaryPopup.visible()) {
  <app-admin-login-summary-modal (closed)="adminLoginSummaryPopup.close()" />
}

<div class="gn2">
  <header class="gn2-hero gn2-hero--stacked">
    <div class="gn2-hero__text">
      <h1 class="gn2__title">Painel de administração</h1>
      <p class="gn2__subtitle">Clientes, encomendas e receitas da plataforma</p>
    </div>
    <div class="gn2-hero__chips">
      @if (lastUpdated()) {
        <time class="gn2-hero__chip" [attr.datetime]="lastUpdated()!.toISOString()">
          Actualizado {{ formatDateTime(lastUpdated()!) }}
        </time>
      }
      @for (link of navLinks; track link.route) {
        <a [routerLink]="link.route" class="gn2-hero__chip gn2-hero__chip--action">{{ link.label }}</a>
      }
    </div>
  </header>

  @if (loading()) {
    <div class="gn2-inline-loading" role="status">
      <span class="gn2-spinner" aria-hidden="true"></span>
      <p>A carregar…</p>
    </div>
  } @else {
    <section class="gn2-summary-panel" aria-label="Resumo operacional">
      <app-admin-alerts-bar [alerts]="alerts()" />
      <app-admin-kpi-section [adminStats]="adminStats()" />
    </section>

    <app-admin-charts-section
      [ordersRevenueByMonth]="ordersRevenueByMonth()"
      [licenseRevenueByMonth]="licenseRevenueByMonth()"
      [adminStats]="adminStats()"
    />
  }
</div>
