<section class="bi-charts" aria-label="Gráficos">
  <article class="bi-visual bi-visual--main">
    <header class="bi-visual__header">
      <h2 class="bi-visual__title">Receitas — licenças vs lucro encomendas</h2>
    </header>
    <div class="bi-visual__body">
      <div class="chart-container chart-main">
        <canvas #chartRevenueCompare></canvas>
      </div>
    </div>
  </article>

  <article class="bi-visual bi-visual--side">
    <header class="bi-visual__header">
      <h2 class="bi-visual__title">Licenças</h2>
    </header>
    <div class="bi-visual__body">
      <div class="chart-container chart-side">
        <canvas #chartLicenses></canvas>
      </div>
    </div>
  </article>
</section>
