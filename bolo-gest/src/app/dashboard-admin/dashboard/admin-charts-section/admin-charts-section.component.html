<section class="charts-row">
  <div class="report-card chart-card-wide">
    <h2 class="report-title">Receita por mês</h2>
    <p class="report-desc">Evolução da receita (todos os utilizadores)</p>
    <div class="chart-container chart-tall">
      <canvas #chartRevenueMonth></canvas>
    </div>
  </div>
  <div class="report-card">
    <h2 class="report-title">Distribuição de licenças</h2>
    <p class="report-desc">Activos vs não activos</p>
    <div class="chart-container chart-medium">
      <canvas #chartLicenses></canvas>
    </div>
  </div>
  <div class="report-card">
    <h2 class="report-title">Actividade hoje</h2>
    <p class="report-desc">Logins e utilizadores únicos</p>
    <div class="chart-container chart-medium">
      <canvas #chartActivity></canvas>
    </div>
  </div>
</section>
