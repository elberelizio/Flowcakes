<section class="bi-metrics" aria-label="Métricas principais">
  <div class="bi-metrics__grid">
    @for (m of metrics(); track m.label) {
      @if (m.route) {
        <a [routerLink]="m.route" class="bi-metrics__card" [attr.data-accent]="m.accent">
          <span class="bi-metrics__icon" [attr.data-icon]="m.icon" aria-hidden="true"></span>
          <div class="bi-metrics__body">
            <span class="bi-metrics__label">{{ m.label }}</span>
            <span class="bi-metrics__value">{{ m.value }}</span>
            @if (m.hint) {
              <span class="bi-metrics__hint">{{ m.hint }}</span>
            }
          </div>
        </a>
      } @else {
        <div class="bi-metrics__card" [attr.data-accent]="m.accent">
          <span class="bi-metrics__icon" [attr.data-icon]="m.icon" aria-hidden="true"></span>
          <div class="bi-metrics__body">
            <span class="bi-metrics__label">{{ m.label }}</span>
            <span class="bi-metrics__value">{{ m.value }}</span>
            @if (m.hint) {
              <span class="bi-metrics__hint">{{ m.hint }}</span>
            }
          </div>
        </div>
      }
    }
  </div>
</section>
