<div class="login-success-overlay" [class.closing]="closing">
  <div class="login-success-card">
    <img src="/logotipo.png" alt="Chef Control" class="login-success-logo" />
    <h2 class="login-success-title">Login efectuado com sucesso</h2>
    <p class="login-success-text">A redireccionar para a área de administração…</p>
    <div class="login-success-check-wrap">
      <svg class="login-success-check" viewBox="0 0 52 52" aria-hidden="true">
        <circle class="login-success-check-circle" cx="26" cy="26" r="24" fill="none" stroke="currentColor" stroke-width="2"/>
        <path class="login-success-check-path" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 26l8 8 16-18"/>
      </svg>
    </div>
  </div>
</div>
